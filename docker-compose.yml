services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: postgis-webmap
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: webmap_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    # Chỉnh theo RAM máy: shared_buffers ~25% RAM, effective_cache_size ~50-75% RAM
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=3GB
      -c max_parallel_workers_per_gather=2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webmap_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    container_name: pg_tileserv
    restart: unless-stopped
    environment:
      # Dùng role chỉ đọc, chỉ thấy schema clean
      DATABASE_URL: postgresql://tile_reader:${TILE_PASSWORD}@postgis:5432/webmap_db
      TS_URLBASE: /
      TS_DEBUG: "false"
    ports:
      - "127.0.0.1:7800:7800"
    depends_on:
      postgis:
        condition: service_healthy

  versatiles:
    image: versatiles/versatiles:latest
    container_name: versatiles
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data:ro
    command:
      - serve
      - "[vietnam]/data/vietnam.versatiles"
      - "[satellite]/data/satellite_vietnam.versatiles"

volumes:
  postgis_data: